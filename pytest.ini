[pytest]
# Docker-backed integration tests build real images and run real
# containers (tens of seconds each), so they're out of the default run.
# Everything else is hermetic and finishes in about a second.
#   pytest              -> unit tests only
#   pytest -m docker    -> the integration tests
#   pytest -m loadtest  -> drives real load at a stack (slowest)
addopts = -m "not docker and not loadtest"
markers =
    docker: needs a reachable Docker daemon; builds images and runs containers
    loadtest: drives real load through a generated stack; slow and resource-hungry
