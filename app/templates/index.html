{% extends "base.html" %}
{% block content %}
<form action="/generate" method="post">
  <fieldset>
    <legend>1. PostgreSQL version</legend>
    {% for v in pg_versions %}
    <label>
      <input type="radio" name="pg_version" value="{{ v }}" {% if loop.first %}checked{% endif %}>
      PostgreSQL {{ v }}
    </label>
    {% endfor %}
  </fieldset>

  <fieldset>
    <legend>2. Workload</legend>
    {% for w in workloads %}
    <label class="workload-option">
      <input type="radio" name="workload_key" value="{{ w.key }}" {% if loop.first %}checked{% endif %}>
      <strong>{{ w.label }}</strong> — {{ w.description }}
    </label>
    {% endfor %}
  </fieldset>

  <button type="submit">Next: recommend hardware &amp; generate conf</button>
</form>
{% endblock %}
