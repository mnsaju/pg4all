{% extends "base.html" %}
{% block content %}
<form action="/generate" method="post">
  <div class="field-group">
    <span class="field-label">1. PostgreSQL version</span>
    <p class="field-hint">Always the current latest official minor release for that major.</p>
    <div class="option-grid cols-3">
      {% for v in pg_versions %}
      <label class="option">
        <input type="radio" name="pg_version" value="{{ v.major }}" {% if loop.first %}checked{% endif %}>
        <span class="option-title">PostgreSQL {{ v.major }}</span>
        <span class="option-meta">{{ v.full_version }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <div class="field-group">
    <span class="field-label">2. Workload</span>
    <div class="option-grid">
      {% for w in workloads %}
      <label class="option">
        <input type="radio" name="workload_key" value="{{ w.key }}" {% if loop.first %}checked{% endif %}>
        <span class="option-title">{{ w.label }}</span>
        <span class="option-desc">{{ w.description }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <button type="submit" class="btn btn-primary">Next: recommend hardware &amp; generate conf</button>
</form>
{% endblock %}
